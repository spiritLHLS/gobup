basePath: /api
definitions:
  controllers.HistoryProgressResponse:
    properties:
      activeCount:
        type: integer
      historyId:
        type: integer
      items:
        items:
          $ref: '#/definitions/upload.Progress'
        type: array
      overallPercent:
        type: integer
    type: object
  models.RecordRoom:
    properties:
      areaName:
        type: string
      areaNameChild:
        type: string
      areaNameParent:
        type: string
      autoExtractCover:
        type: boolean
      autoParseDanmaku:
        description: 自动解析弹幕
        type: boolean
      autoPublish:
        description: 所有分P上传完成后自动投稿
        type: boolean
      autoSyncInfo:
        description: 定时同步视频信息（每30分钟）
        type: boolean
      autoUpdatePublished:
        description: 弹幕版上传后自动更新已投稿视频
        type: boolean
      autoUpload:
        description: 录制完成后自动上传分P
        type: boolean
      availableLines:
        description: 可用线路列表，逗号分隔，用于自动切换
        type: string
      copyright:
        type: integer
      coverFrameSecond:
        type: integer
      coverType:
        description: default, live, frame, diy
        type: string
      coverUrl:
        type: string
      createdAt:
        type: string
      danmakuBurnStyle:
        description: 弹幕样式：default, compact, large
        type: string
      danmakuDisplayArea:
        description: 弹幕显示区域比例
        type: number
      danmakuFontColor:
        description: '弹幕统一颜色，空=保留原色，支持 #RRGGBB'
        type: string
      danmakuFontSize:
        description: 弹幕字号，0=跟随样式预设
        type: integer
      danmakuScrollArea:
        description: 滚动弹幕区域比例
        type: number
      descTemplate:
        type: string
      dmDistinct:
        description: 弹幕去重
        type: boolean
      dmKeywordBlacklist:
        description: 关键词屏蔽，一行一个
        type: string
      dmMedalLevel:
        description: 粉丝勋章过滤 0-不过滤 1-佩戴粉丝勋章 2-佩戴主播粉丝勋章
        type: integer
      dmUlLevel:
        description: 用户等级过滤
        type: integer
      durationLimit:
        type: integer
      dynamicTemplate:
        type: string
      enableDanmakuBurn:
        description: 启用弹幕烧录（生成带弹幕版本）
        type: boolean
      enablePreTranscode:
        description: 上传前使用 FFmpeg 转码/压缩
        type: boolean
      fileOpAction:
        description: 'FileOpAction: 0=不处理, 1=删除, 2=移动, 3=复制'
        type: integer
      fileOpDelay:
        description: 'FileOpDelay: 0=立即执行, N=N天后执行'
        type: integer
      fileOpScope:
        description: 'FileOpScope bitmask: 1=视频文件, 2=弹幕(.xml), 4=封面(.jpg/.png)'
        type: integer
      fileOpTrigger:
        description: |-
          文件操作配置（替代旧版 DeleteType/DeleteDay）
          FileOpTrigger: 0=不处理, 1=分P上传完成后, 2=全部分P上传完成后（投稿前）, 3=投稿成功后, 4=审核通过后
        type: integer
      fileSizeLimit:
        type: integer
      highEnergyCut:
        type: boolean
      historyId:
        type: integer
      id:
        type: integer
      isOnlySelf:
        type: boolean
      lastCheckTime:
        description: 最后检查时间
        type: string
      lastSyncTime:
        description: 最后同步时间
        type: string
      line:
        type: string
      liveStatus:
        description: '直播状态: 0未开播 1正在直播 2轮播中'
        type: integer
      mergeBySession:
        description: 同SessionID合并到一个投稿
        type: boolean
      minSegmentDuration:
        description: 最小片段时长(秒)
        type: integer
      moveDir:
        type: string
      noDisturbance:
        type: boolean
      partTitleTemplate:
        type: string
      percentileRank:
        type: number
      priority:
        description: 自动上传调度优先级，0-100，数值越大越优先
        type: integer
      pushMsgTags:
        type: string
      recording:
        type: boolean
      roomId:
        type: string
      seasonId:
        type: integer
      sendDm:
        type: boolean
      sessionId:
        type: string
      sourceTemplate:
        description: 转载来源模板，支持变量替换
        type: string
      streaming:
        type: boolean
      tags:
        type: string
      tid:
        type: integer
      title:
        type: string
      titleTemplate:
        type: string
      transcodeAudioBitrate:
        type: string
      transcodeCrf:
        type: integer
      transcodeMaxWidth:
        description: 0=保持原宽度
        type: integer
      transcodePreset:
        type: string
      transcodeVideoCodec:
        description: h264, h265
        type: string
      uname:
        type: string
      updatedAt:
        type: string
      upload:
        description: 启用上传功能（总开关）
        type: boolean
      uploadSpeedLimitMbps:
        description: 房间级上传限速，MB/s，0=使用全局/不限制
        type: number
      uploadUserId:
        type: integer
      uploadUserStrategy:
        description: fixed, round_robin, least_queue
        type: string
      uploadWindowEnabled:
        type: boolean
      uploadWindowEnd:
        description: HH:MM
        type: string
      uploadWindowStart:
        description: HH:MM
        type: string
      windowSize:
        description: 高能剪辑窗口大小(秒)
        type: integer
      wxuid:
        type: string
    type: object
  upload.Progress:
    properties:
      chunkDone:
        type: integer
      chunkTotal:
        type: integer
      historyId:
        type: integer
      page:
        type: integer
      partId:
        type: integer
      percent:
        type: integer
      state:
        $ref: '#/definitions/upload.ProgressState'
      stateMsg:
        type: string
      updateAtMs:
        type: integer
    type: object
  upload.ProgressState:
    enum:
    - TRANSCODING
    - PROCESSING
    - UPLOADING
    - RETRY_WAIT
    - SUCCESS
    - FAILED
    type: string
    x-enum-varnames:
    - StateTranscoding
    - StateProcessing
    - StateUploading
    - StateRetryWait
    - StateSuccess
    - StateFailed
